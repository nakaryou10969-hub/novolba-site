name: Deploy draftKey preview to Lambda

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novolba-preview-deployment
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test draftKey preview
        run: |
          npm run test:preview
          npm run test:preview:lambda

      - name: Build preview shell without CMS credentials
        run: npm run build:preview:lambda

      - name: Package Lambda preview
        run: npm run package:preview:lambda

      - name: Deploy dedicated preview
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.PREVIEW_AWS_ACCOUNT_ID }}
          PREVIEW_STACK_NAME: novolba-microcms-preview
          PREVIEW_FUNCTION_NAME: novolba-microcms-preview
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: node preview/lambda/deploy.mjs
